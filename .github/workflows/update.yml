name: バトロワのデータ更新と公開

on:
  schedule:
  - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "build_data.py", "i18n/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 試合データは履歴を増やさないよう data ブランチ（毎回1コミットに置き換え）に置く
      - name: これまでの試合データを取り出す
        run: |
          if git fetch --depth 1 origin data; then git checkout FETCH_HEAD -- data/; fi
      - name: 試合データを集める
        if: github.event_name != 'push'
        env:
          BRAWL_API_KEY: ${{ secrets.BRAWL_API_KEY }}
        run: python3 collect.py --max-players 3000
      - name: サイト用データを作る
        run: if [ -f data/battles.jsonl.gz ]; then python3 build_data.py; fi
      - name: 試合データを data ブランチに保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          git add -f data/battles.jsonl.gz data/names.json data/brawlers.json
          commit=$(git commit-tree "$(git write-tree)" -m "データ更新 $(date -u +%Y-%m-%dT%H:%MZ)")
          git push -f origin "$commit:refs/heads/data"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
